<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<defs><style>.title{font:700 26px Arial;fill:#17324d}.panel{fill:#f7fbff;stroke:#8aa7c2;stroke-width:2}.head{font:700 18px Arial;fill:#17324d}.node{fill:#fff;stroke:#547da5;stroke-width:2}.start{fill:#e8f3fb;stroke:#547da5;stroke-width:2}.op{font:15px Arial;fill:#243746}.decision{fill:#fff8e8;stroke:#c28b31;stroke-width:2}.arrow{stroke:#547da5;stroke-width:2;fill:none;marker-end:url(#a)}.label{font:13px Arial;fill:#536879}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#547da5"/></marker></defs>
<rect width="1100" height="650" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">Просмотр заказов</text>
<rect x="35" y="75" width="495" height="540" rx="14" class="panel"/><text x="282" y="110" text-anchor="middle" class="head">Покупатель</text>
<ellipse cx="282" cy="155" rx="75" ry="24" class="start"/><text x="282" y="160" text-anchor="middle" class="op">Начало</text><path d="M282 179V205" class="arrow"/>
<rect x="152" y="205" width="260" height="52" rx="8" class="node"/><text x="282" y="237" text-anchor="middle" class="op">Открыть «Мои заказы»</text><path d="M282 257V285" class="arrow"/>
<rect x="152" y="285" width="260" height="52" rx="8" class="node"/><text x="282" y="317" text-anchor="middle" class="op">Загрузить свои заказы</text><path d="M282 337V360" class="arrow"/>
<polygon points="282,360 385,402 282,444 179,402" class="decision"/><text x="282" y="407" text-anchor="middle" class="op">Заказы есть?</text>
<path d="M179 402H105V480" class="arrow"/><text x="130" y="390" class="label">Нет</text><rect x="50" y="480" width="180" height="55" rx="8" class="node"/><text x="140" y="513" text-anchor="middle" class="op">«Заказов пока нет»</text>
<path d="M385 402H455V480" class="arrow"/><text x="410" y="390" class="label">Да</text><rect x="330" y="480" width="180" height="55" rx="8" class="node"/><text x="420" y="503" text-anchor="middle" class="op">Список и детали</text><text x="420" y="522" text-anchor="middle" class="label">по выбранному заказу</text>
<path d="M140 535V565H282" class="arrow"/><path d="M420 535V565H282" class="arrow"/><ellipse cx="282" cy="575" rx="55" ry="20" class="start"/><text x="282" y="580" text-anchor="middle" class="op">Конец</text>
<rect x="570" y="75" width="495" height="540" rx="14" class="panel"/><text x="817" y="110" text-anchor="middle" class="head">Администратор</text>
<ellipse cx="817" cy="155" rx="75" ry="24" class="start"/><text x="817" y="160" text-anchor="middle" class="op">Начало</text><path d="M817 179V205" class="arrow"/>
<polygon points="817,205 920,247 817,289 714,247" class="decision"/><text x="817" y="252" text-anchor="middle" class="op">Есть доступ?</text>
<path d="M714 247H640V330" class="arrow"/><text x="665" y="235" class="label">Нет</text><rect x="585" y="330" width="180" height="55" rx="8" class="node"/><text x="675" y="363" text-anchor="middle" class="op">Отказать в доступе</text>
<path d="M920 247H990V320" class="arrow"/><text x="940" y="235" class="label">Да</text><rect x="870" y="320" width="180" height="55" rx="8" class="node"/><text x="960" y="353" text-anchor="middle" class="op">Загрузить все заказы</text><path d="M960 375V405" class="arrow"/>
<rect x="870" y="405" width="180" height="55" rx="8" class="node"/><text x="960" y="428" text-anchor="middle" class="op">Выбрать заказ</text><text x="960" y="447" text-anchor="middle" class="label">и посмотреть детали</text><path d="M960 460V485" class="arrow"/>
<rect x="870" y="485" width="180" height="55" rx="8" class="node"/><text x="960" y="508" text-anchor="middle" class="op">При необходимости</text><text x="960" y="528" text-anchor="middle" class="label">изменить статус</text>
<path d="M675 385V570H817" class="arrow"/><path d="M960 540V570H817" class="arrow"/><ellipse cx="817" cy="580" rx="55" ry="20" class="start"/><text x="817" y="585" text-anchor="middle" class="op">Конец</text>
</svg>
