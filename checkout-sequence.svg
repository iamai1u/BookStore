<g class="head" text-anchor="middle"><text x="95" y="105">Покупатель</text><text x="275" y="105">CheckoutView</text><text x="465" y="105">OrderController</text><text x="662" y="105">OrderService</text><text x="867" y="105">ProductRepository</text><text x="1080" y="105">OrderRepository</text></g>
