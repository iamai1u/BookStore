<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><style>.title{font:700 26px Arial;fill:#17324d}.head{font:700 15px Arial;fill:#17324d}.txt{font:14px Arial;fill:#243746}.participant{fill:#f7fbff;stroke:#547da5;stroke-width:2}.life{stroke:#a1b2c1;stroke-width:1.5;stroke-dasharray:7 6}.msg{stroke:#345f85;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#74899c;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#b)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#345f85"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#74899c"/></marker></defs>
<rect width="1200" height="650" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="title">Последовательность оформления заказа</text>
