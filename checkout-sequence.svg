<g class="msg"><path d="M95 165H275"/><path d="M275 210H465"/><path d="M465 255H662"/><path d="M662 300H867"/><path d="M867 345H662"/><path d="M662 390H662"/><path d="M662 435H1080"/><path d="M1080 480H662"/><path d="M662 525H465"/><path d="M465 560H275"/><path d="M275 590H95"/></g>
<g class="txt"><text x="180" y="155" text-anchor="middle">Подтверждает заказ</text><text x="370" y="200" text-anchor="middle">checkout(cartId)</text><text x="565" y="245" text-anchor="middle">createOrder(...)</text><text x="765" y="290" text-anchor="middle">Найти книги и остатки</text><text x="765" y="335" text-anchor="middle">Вернуть данные книг</text><text x="685" y="382">Проверить корзину, наличие, сумму и скидку</text><text x="870" y="425" text-anchor="middle">Сохранить заказ</text><text x="870" y="470" text-anchor="middle">Вернуть результат</text><text x="565" y="515" text-anchor="middle">OrderResult</text><text x="370" y="552" text-anchor="middle">Показать номер и сумму</text><text x="180" y="585" text-anchor="middle">Видит подтверждение</text></g>
<text x="600" y="625" text-anchor="middle" class="txt">При ошибке проверки или сохранения сервис возвращает сообщение, а заказ не показывается как успешный.</text>
